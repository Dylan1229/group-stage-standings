_ > nanoagent.plugin.v0001.ManifestConfig:
id: group-stage-standings
name: Group Stage Standings
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  list_tournaments:
    description: List the bundled fictional tournaments, each group's teams (best seed first) and last matchday
  get_group_matches:
    description: "One group's teams with their seeds and every match of every matchday: md, status, home, away, goals hg/ag (null if postponed), cards hc/ac as [yellow, second_yellow, red, yellow_red]"
  save_standings:
    description: Save a group table (rows in rank order and the two qualified teams) to standings/<tournament>-<group>-md<N>-<ruleset>.json and return it with its path; it checks the table's shape only, never its values
  pin_standings:
    description: The answer key, never an agent's tool; the correct table under the ruleset, the matches it counts and the data's sha256

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  rank-group:
    description: Rank a group of a fictional football tournament under the fifa or uefa tiebreakers
    runner: agent
    tools: [list_tournaments, get_group_matches, save_standings]
    reference: pin_standings
    instructions: |-
      Plan (3 tool turns, 1 spare; do not call list_tournaments):
      Turn 1: get_group_matches(tournament, group).
      Turn 2: work out the table, then call save_standings with tournament, group, through_matchday and ruleset as given, rows in rank order and qualified.
      Turn 3: submit exactly what save_standings returned. If it refused the table, fix what it says, save again, then submit.
      Think briefly: one short line of numbers per team, no prose.

      Count only matches with status played and md <= through_matchday. Per team: played, won, drawn, lost, goals_for, goals_against, goal_difference = goals_for - goals_against, points = 3 per win + 1 per draw, fair_play = -(1*yellow + 3*second_yellow + 4*red + 5*yellow_red) summed over its counted matches (hc/ac are [yellow, second_yellow, red, yellow_red]; a team's own cards only). A team with no counted match has all zeros.
      Rank by the ruleset's criteria in order; for every criterion higher is better (fair_play 0 beats -2), except seed, where the smaller number is better. Head to head (h2h) means points, goal difference and goals scored counted only in the counted matches between the teams of the set in question.
      fifa: (1) points, (2) goal difference, (3) goals scored. Teams level on all three form one set: (4) h2h points, (5) h2h goal difference, (6) h2h goals, computed once over the matches among that whole set and never recomputed for a smaller part of it; then (7) fair_play; (8) seed.
      uefa: (1) points. Teams level on points form a set: (2) h2h points, (3) h2h goal difference, (4) h2h goals among that set. (5) If this separates some of them but leaves 2 or more level, apply (2)-(4) again over the matches among only those still level, and repeat. A set that (2)-(4) cannot split at all is ranked by (6) goal difference, (7) goals scored in all counted matches, (8) fair_play, (9) seed.
      Rows: position 1..n in rank order, every team of the group once, names exactly as given. qualified: the teams at positions 1 and 2, in that order.
  get-group-matches:
    description: Show a group's teams, seeds and every match with its score and cards
    runner: tool
    tools: [get_group_matches]
    reference: null
    instructions: Return the group's teams with their seeds and every match of every matchday, postponed ones included, as the bundled data holds them.
